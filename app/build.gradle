plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// ---------------------------------------------------------------------------
// 签名配置
//
// 优先级：
//   1. 环境变量（CI 由 GitHub Secrets 注入）：
//      RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
//   2. 工程根目录 keystore.properties（本地开发用，已在 .gitignore 中忽略）
//   3. 两者都没有时回退 debug 签名，保证 release APK 仍可安装
//
// keystore.properties 格式：
//   storeFile=freedom-release.jks
//   storePassword=<你的密钥库口令>
//   keyAlias=freedom
//   keyPassword=<你的密钥口令>
// 生成新密钥的命令见 docs/构建.md。
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def propsStoreFile = keystoreProps.getProperty("storeFile")
def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
        ?: (propsStoreFile ? rootProject.file(propsStoreFile).absolutePath : rootProject.file("keystore.jks").absolutePath)
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword") ?: releaseStorePassword
def hasReleaseSigning = releaseStorePassword && releaseKeyAlias && file(releaseStoreFile).exists()

android {
    namespace "io.github.fplus"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.fplus"
        minSdk 24
        targetSdk 33

        versionCode 146
        versionName "1.3.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    aaptOptions {
        additionalParameters '--allow-reserved-package-id', '--package-id', '0x64'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig(hasReleaseSigning ? signingConfigs.release : signingConfigs.debug)
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.4.3"
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    // 更新version的内容
    tasks.register("updateVersionFile") {
        def versionName = android.defaultConfig.versionName
        def versionCode = android.defaultConfig.versionCode
        def versionContent = versionName + "-" + versionCode

        File versionFile = file("src/main/assets/version")
        versionFile.write(versionContent)
    }

    //执行task任务
    applicationVariants.configureEach { variant ->
        variant.assembleProvider.get().dependsOn updateVersionFile

        variant.outputs.configureEach { output ->
            def filename = "freedom+_" + android.defaultConfig.versionName + ".apk"
            output.outputFileName filename
        }
    }
}

dependencies {
    implementation(libs.core.ktx)
    implementation(libs.lifecycle.runtime.ktx)
    implementation(libs.documentfile)

    //compose
    implementation(libs.activity.compose)
    implementation(platform(libs.compose.bom))
    implementation(libs.ui)
    implementation(libs.ui.graphics)
    implementation(libs.ui.tooling.preview)
    implementation(libs.compose.material)

    // custom
    implementation(libs.accompanist.systemuicontroller)
    implementation(libs.runtime.livedata)
    implementation(libs.mmkv)

    implementation project(":core")
    implementation project(":webdav")
    implementation project(":ktutils")
}