name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 仓库里的 ktutils / xpler 没有以 git submodule 形式提交（.gitmodules 存在但缺少 gitlink），
      # 这里兜底克隆；如果以后正确添加了 submodule，这一步会自动跳过。
      - name: Clone missing dependencies
        run: |
          if [ ! -f ktutils/build.gradle ]; then
            git clone --depth 1 https://github.com/GangJust/ktutils.git ktutils
          fi
          if [ ! -f xpler/build.gradle.kts ]; then
            git clone --depth 1 https://github.com/ThatWorld/xpler.git xpler
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 编译失败时把日志尾部输出为 GitHub annotation，方便在未登录的情况下排查
      - name: Show failure
        if: failure()
        run: |
          tail -n 100 build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/}"
            echo "::error::${line}"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
