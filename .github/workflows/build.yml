name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 仓库里的 ktutils / xpler 没有以 git submodule 形式提交（.gitmodules 存在但缺少 gitlink），
      # 这里兜底克隆；如果以后正确添加了 submodule，这一步会自动跳过。
      - name: Clone missing dependencies
        run: |
          if [ ! -f ktutils/build.gradle ]; then
            git clone https://github.com/GangJust/ktutils.git ktutils
            git -C ktutils checkout 5a3da74659d110da34d7f7560a769deabd645962
          fi
          if [ ! -f xpler/build.gradle.kts ]; then
            git clone https://github.com/ThatWorld/xpler.git xpler
            git -C xpler checkout 6c134681823da7483a20659b560bc44256f83761
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 编译失败时把完整日志输出为 GitHub annotation，方便在未登录 API 的情况下排查
      - name: Show failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          try:
              data = Path("build.log").read_text(encoding="utf-8", errors="replace")
          except FileNotFoundError:
              data = "build.log not found"

          data = data.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error::" + data[:60000])
          PY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
