name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 仓库里的 ktutils / xpler 没有以 git submodule 形式提交（.gitmodules 存在但缺少 gitlink），
      # 这里兜底克隆并固定版本；如果以后正确添加了 submodule，这一步会自动跳过。
      - name: Clone missing dependencies
        run: |
          if [ ! -f ktutils/build.gradle ]; then
            git clone https://github.com/GangJust/ktutils.git ktutils
            git -C ktutils checkout 5a3da74659d110da34d7f7560a769deabd645962
          fi
          if [ ! -f xpler/build.gradle.kts ]; then
            git clone https://github.com/ThatWorld/xpler.git xpler
            git -C xpler checkout 6c134681823da7483a20659b560bc44256f83761
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: freedomplus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
